[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "fx-treasury-engine"
version = "0.1.0"
description = "Cross-Border FX & Treasury Risk Engine"
authors = ["Ingeniero de Datos"]

[tool.poetry.dependencies]
python = "^3.11"
httpx = "^0.25.0"
pydantic = "^2.5.0"
pandas = "^2.1.0"
pyyaml = "^6.0.1"
python-dateutil = "^2.8.2"
structlog = "^23.2.0"
tenacity = "^8.2.3"
cachetools = "^5.3.1"
streamlit = "^1.28.0"
fastapi = "^0.100.0"
uvicorn = "^0.22.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
pytest-cov = "^4.1.0"
responses = "^0.23.1"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
